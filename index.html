<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💧 Sıvı Simülasyonu | MOV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --accent: #8b5cf6;
            --bg-dark: #0a0a12;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 1rem 2rem;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            display: flex;
            gap: 2rem;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Canvas Container */
        #canvasContainer {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Controls Panel */
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 5px 20px rgba(6, 182, 212, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
        }

        /* Settings Panel */
        .settings {
            position: fixed;
            top: 5rem;
            right: 1rem;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            z-index: 100;
            min-width: 250px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .settings.hidden {
            transform: translateX(calc(100% + 2rem));
            opacity: 0;
            pointer-events: none;
        }

        .settings h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .setting-item {
            margin-bottom: 1rem;
        }

        .setting-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .setting-item input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
        }

        .color-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-btn:hover,
        .color-btn.active {
            transform: scale(1.2);
            border-color: white;
        }

        /* Instructions */
        .hint {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }

        @media (max-width: 600px) {
            .stats {
                gap: 1rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .settings {
                left: 1rem;
                right: 1rem;
                min-width: auto;
            }

            .controls {
                bottom: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">💧 Sıvı Simülasyonu</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="particleCount">0</div>
                <div class="stat-label">Parçacık</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="fpsValue">60</div>
                <div class="stat-label">FPS</div>
            </div>
        </div>
    </header>

    <div id="canvasContainer">
        <canvas id="fluidCanvas"></canvas>
    </div>

    <div class="hint">Ekrana tıklayarak veya sürükleyerek sıvı ekleyin</div>

    <div class="controls">
        <button class="btn btn-secondary" onclick="toggleSettings()">⚙️ Ayarlar</button>
        <button class="btn btn-primary" onclick="addParticles()">💧 Sıvı Ekle</button>
        <button class="btn btn-danger" onclick="clearParticles()">🗑️ Temizle</button>
        <button class="btn btn-secondary" onclick="toggleGravity()">🌍 Yerçekimi</button>
    </div>

    <!-- Settings Panel -->
    <div class="settings hidden" id="settingsPanel">
        <h3>⚙️ Simülasyon Ayarları</h3>

        <div class="setting-item">
            <label>Yerçekimi Gücü: <span id="gravityValue">0.5</span></label>
            <input type="range" id="gravitySlider" min="0" max="2" step="0.1" value="0.5" oninput="updateGravity()">
        </div>

        <div class="setting-item">
            <label>Parçacık Boyutu: <span id="sizeValue">8</span></label>
            <input type="range" id="sizeSlider" min="3" max="20" step="1" value="8" oninput="updateSize()">
        </div>

        <div class="setting-item">
            <label>Viskozite: <span id="viscosityValue">0.98</span></label>
            <input type="range" id="viscositySlider" min="0.9" max="1" step="0.01" value="0.98"
                oninput="updateViscosity()">
        </div>

        <div class="setting-item">
            <label>Yüzey Gerilimi: <span id="tensionValue">0.5</span></label>
            <input type="range" id="tensionSlider" min="0" max="1" step="0.1" value="0.5" oninput="updateTension()">
        </div>

        <div class="setting-item">
            <label>Renk Seçimi</label>
            <div class="color-buttons">
                <button class="color-btn active" style="background: linear-gradient(135deg, #06b6d4, #3b82f6)"
                    onclick="setColor(0)"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #8b5cf6, #ec4899)"
                    onclick="setColor(1)"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #10b981, #84cc16)"
                    onclick="setColor(2)"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #f59e0b, #ef4444)"
                    onclick="setColor(3)"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #ffffff, #94a3b8)"
                    onclick="setColor(4)"></button>
            </div>
        </div>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('fluidCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Particle System
        const particles = [];
        const MAX_PARTICLES = 2000;

        // Physics Settings
        let gravity = 0.5;
        let particleRadius = 8;
        let viscosity = 0.98;
        let surfaceTension = 0.5;
        let gravityEnabled = true;

        // Color Palettes
        const colorPalettes = [
            { start: '#06b6d4', end: '#3b82f6' },   // Cyan-Blue
            { start: '#8b5cf6', end: '#ec4899' },   // Purple-Pink
            { start: '#10b981', end: '#84cc16' },   // Green-Lime
            { start: '#f59e0b', end: '#ef4444' },   // Orange-Red
            { start: '#ffffff', end: '#94a3b8' }    // White-Gray
        ];
        let currentPalette = 0;

        // Mouse State
        let mouse = { x: 0, y: 0, isDown: false };
        let lastMouse = { x: 0, y: 0 };

        // FPS Counter
        let fps = 60;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        // Particle Class
        class Particle {
            constructor(x, y, vx = 0, vy = 0) {
                this.x = x;
                this.y = y;
                this.vx = vx + (Math.random() - 0.5) * 2;
                this.vy = vy + (Math.random() - 0.5) * 2;
                this.radius = particleRadius + Math.random() * 2 - 1;
                this.life = 1;
                this.palette = currentPalette;
                this.hueOffset = Math.random() * 30 - 15;
            }

            update() {
                // Apply gravity
                if (gravityEnabled) {
                    this.vy += gravity;
                }

                // Apply viscosity (damping)
                this.vx *= viscosity;
                this.vy *= viscosity;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Boundary collision
                const bounce = 0.6;

                if (this.x < this.radius) {
                    this.x = this.radius;
                    this.vx *= -bounce;
                }
                if (this.x > canvas.width - this.radius) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -bounce;
                }
                if (this.y < this.radius) {
                    this.y = this.radius;
                    this.vy *= -bounce;
                }
                if (this.y > canvas.height - this.radius) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -bounce;
                }
            }

            draw() {
                const palette = colorPalettes[this.palette];

                // Create gradient for 3D effect
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
                    this.x, this.y, this.radius
                );

                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(0.3, palette.start);
                gradient.addColorStop(1, palette.end);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Glow effect
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 1.5, 0, Math.PI * 2);
                const glowGradient = ctx.createRadialGradient(
                    this.x, this.y, this.radius * 0.5,
                    this.x, this.y, this.radius * 1.5
                );
                glowGradient.addColorStop(0, palette.start + '40');
                glowGradient.addColorStop(1, 'transparent');
                ctx.fillStyle = glowGradient;
                ctx.fill();
            }
        }

        // Particle Interactions
        function applyParticleInteractions() {
            const interactionRadius = particleRadius * 4;
            const tensionForce = surfaceTension * 0.1;

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[j].x - particles[i].x;
                    const dy = particles[j].y - particles[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < interactionRadius && dist > 0) {
                        // Repulsion when too close
                        const minDist = (particles[i].radius + particles[j].radius) * 0.8;
                        if (dist < minDist) {
                            const force = (minDist - dist) / minDist * 2;
                            const fx = (dx / dist) * force;
                            const fy = (dy / dist) * force;

                            particles[i].vx -= fx;
                            particles[i].vy -= fy;
                            particles[j].vx += fx;
                            particles[j].vy += fy;
                        }

                        // Surface tension - cohesion at medium distance
                        if (dist > minDist && dist < interactionRadius) {
                            const force = tensionForce * (1 - dist / interactionRadius);
                            const fx = (dx / dist) * force;
                            const fy = (dy / dist) * force;

                            particles[i].vx += fx;
                            particles[i].vy += fy;
                            particles[j].vx -= fx;
                            particles[j].vy -= fy;
                        }
                    }
                }
            }
        }

        // Add particles
        function spawnParticles(x, y, count = 5, vx = 0, vy = 0) {
            for (let i = 0; i < count; i++) {
                if (particles.length < MAX_PARTICLES) {
                    const offsetX = (Math.random() - 0.5) * 20;
                    const offsetY = (Math.random() - 0.5) * 20;
                    particles.push(new Particle(x + offsetX, y + offsetY, vx, vy));
                }
            }
            updateParticleCount();
        }

        function addParticles() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 3;
            spawnParticles(centerX, centerY, 50, 0, 0);
        }

        function clearParticles() {
            particles.length = 0;
            updateParticleCount();
        }

        // Draw background
        function drawBackground() {
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a12');
            gradient.addColorStop(0.5, '#0f0f1a');
            gradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;

            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // Draw metaball effect
        function drawMetaballs() {
            if (particles.length === 0) return;

            // Create temporary canvas for metaball effect
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Draw particles as circles with gradient
            for (const particle of particles) {
                const gradient = tempCtx.createRadialGradient(
                    particle.x, particle.y, 0,
                    particle.x, particle.y, particle.radius * 2
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                tempCtx.beginPath();
                tempCtx.arc(particle.x, particle.y, particle.radius * 2, 0, Math.PI * 2);
                tempCtx.fillStyle = gradient;
                tempCtx.fill();
            }

            // Apply threshold to create metaball effect
            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            const threshold = 200;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > threshold) {
                    data[i] = 255;     // R
                    data[i + 1] = 255; // G
                    data[i + 2] = 255; // B
                    data[i + 3] = 200; // A
                } else {
                    data[i + 3] = 0;
                }
            }

            tempCtx.putImageData(imageData, 0, 0);

            // Draw colored metaballs on main canvas
            ctx.globalCompositeOperation = 'lighter';
            ctx.drawImage(tempCanvas, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
        }

        // Main animation loop
        function animate() {
            drawBackground();

            // Apply interactions
            if (particles.length > 0 && particles.length < 500) {
                applyParticleInteractions();
            }

            // Update and draw particles
            for (const particle of particles) {
                particle.update();
                particle.draw();
            }

            // Draw metaball effect (optional - for performance can be disabled)
            // drawMetaballs();

            // FPS counter
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsTime = now;
                document.getElementById('fpsValue').textContent = fps;
            }

            requestAnimationFrame(animate);
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            mouse.isDown = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            lastMouse.x = e.clientX;
            lastMouse.y = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (mouse.isDown) {
                const vx = (mouse.x - lastMouse.x) * 0.5;
                const vy = (mouse.y - lastMouse.y) * 0.5;
                spawnParticles(mouse.x, mouse.y, 3, vx, vy);
                lastMouse.x = mouse.x;
                lastMouse.y = mouse.y;
            }
        });

        canvas.addEventListener('mouseup', () => {
            mouse.isDown = false;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.isDown = false;
        });

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouse.isDown = true;
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
            lastMouse.x = touch.clientX;
            lastMouse.y = touch.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;

            if (mouse.isDown) {
                const vx = (mouse.x - lastMouse.x) * 0.5;
                const vy = (mouse.y - lastMouse.y) * 0.5;
                spawnParticles(mouse.x, mouse.y, 3, vx, vy);
                lastMouse.x = mouse.x;
                lastMouse.y = mouse.y;
            }
        });

        canvas.addEventListener('touchend', () => {
            mouse.isDown = false;
        });

        // Settings Functions
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function updateGravity() {
            const slider = document.getElementById('gravitySlider');
            gravity = parseFloat(slider.value);
            document.getElementById('gravityValue').textContent = gravity.toFixed(1);
        }

        function updateSize() {
            const slider = document.getElementById('sizeSlider');
            particleRadius = parseInt(slider.value);
            document.getElementById('sizeValue').textContent = particleRadius;
        }

        function updateViscosity() {
            const slider = document.getElementById('viscositySlider');
            viscosity = parseFloat(slider.value);
            document.getElementById('viscosityValue').textContent = viscosity.toFixed(2);
        }

        function updateTension() {
            const slider = document.getElementById('tensionSlider');
            surfaceTension = parseFloat(slider.value);
            document.getElementById('tensionValue').textContent = surfaceTension.toFixed(1);
        }

        function setColor(index) {
            currentPalette = index;
            document.querySelectorAll('.color-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        function toggleGravity() {
            gravityEnabled = !gravityEnabled;
        }

        function updateParticleCount() {
            document.getElementById('particleCount').textContent = particles.length;
        }

        // Initialize
        animate();

        // Add initial particles
        setTimeout(() => {
            addParticles();
        }, 500);
    </script>
</body>

</html>
